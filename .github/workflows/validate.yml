name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate corpus
        run: python3 scripts/validate_papers.py
      - name: Generate statistics
        run: python3 scripts/analysis/generate_analysis.py
      - name: Check README is up to date
        run: python3 scripts/generate_readme.py --check